on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-security:
    name: Frontend Dependency Audit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run npm vulnerability audit
        id: npm_audit
        continue-on-error: true
        run: |
          npm audit --json > frontend-audit.json
          npm audit --audit-level=high

      - name: Upload frontend audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-security-report
          path: frontend/frontend-audit.json
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce frontend security gate
        if: steps.npm_audit.outcome == 'failure'
        run: |
          echo "Frontend security audit failed."
          exit 1

  backend-security:
    name: Backend Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit

      - name: Run Python vulnerability audit
        id: pip_audit
        continue-on-error: true
        run: |
          python -m pip_audit \
            -r Backend/requirements.txt \
            -f json \
            -o backend-audit.json

      - name: Upload backend audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-security-report
          path: backend-audit.json
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce backend security gate
        if: steps.pip_audit.outcome == 'failure'
        run: |
          echo "Backend security audit failed."
          exit 1
