name: Scanner CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  scanner-tests:
    name: Scanner tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Generate build version
        shell: python
        run: |
          import os

          short_sha = os.environ["GITHUB_SHA"][:7]
          run_number = os.environ["GITHUB_RUN_NUMBER"]
          build_version = f"0.2.{run_number}-{short_sha}"

          print(f"Build version: {build_version}")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"BUILD_VERSION={build_version}\n")

      - name: Show build version
        run: python -c "import os; print('BUILD_VERSION=' + os.environ['BUILD_VERSION'])"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Compile Python source
        run: python -m compileall .

      - name: Validate service signatures JSON
        run: python -c "import json; json.load(open('service_signatures.json', encoding='utf-8')); print('service_signatures.json is valid')"

      - name: Run tests
        run: python -m unittest discover -s . -p "test_*.py" -v