name: Scanner CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  scanner-tests:
    name: Scanner tests - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install scapy

      - name: Compile scanner source
        run: python -m compileall -q .

      - name: Validate service signatures
        run: python -c "import json, pathlib; json.loads(pathlib.Path('service_signatures.json').read_text(encoding='utf-8')); print('service_signatures.json is valid JSON')"

      - name: Run scanner test suites
        run: python -m unittest discover -v -s . -p "test_scanner_*.py"
