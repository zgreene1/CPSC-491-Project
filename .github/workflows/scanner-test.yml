name: Scanner Compatibility Tests

on:
  push:
  pull_request:

jobs:
  scanner-tests:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install --upgrade pip scapy

      - name: Run scanner compatibility tests
        run: python -m unittest -v test_scanner_compatibility.py
